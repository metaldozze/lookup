<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Моя музыка</title>
<style>
:root{--bg:#000;--pn:#121212;--hv:#1f1f1f;--tx:#fff;--mut:#b3b3b3;--ac:#1db954}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:grid;grid-template-columns:260px 1fr 380px;grid-template-rows:1fr 84px;gap:8px;padding:8px}
.pn{background:var(--pn);border-radius:10px;overflow:auto;min-height:0}
button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:6px}button:hover{color:#fff}
h2{font-size:22px;margin:18px 0 8px}
small{color:var(--mut)}
/* sidebar */
#side{padding:12px 8px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--mut);font-weight:600;cursor:pointer}
.nav:hover,.nav.on{color:#fff;background:var(--hv)}
.nav i{width:36px;height:36px;border-radius:6px;background:#2a2a2a;display:grid;place-items:center;font-style:normal}
.nav span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 6px;color:var(--mut);font-weight:700}
.up{display:block;margin:12px;padding:8px 14px;border-radius:20px;border:1px solid #444;text-align:center;color:#fff;cursor:pointer;font-weight:600;font-size:13px}
/* main */
#main{padding:16px 22px;background:linear-gradient(#1c3a28 0,var(--pn) 260px)}
#q{width:100%;max-width:420px;padding:12px 18px;border-radius:24px;border:0;background:#2a2a2a;color:#fff;font-size:15px;outline:2px solid transparent}#q:focus{outline-color:#fff}
.row{display:flex;align-items:center;gap:14px;padding:8px 10px;border-radius:6px;cursor:pointer}
.row:hover{background:#ffffff1a}.row.cur .t{color:var(--ac)}
.row img{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#333}
.row div{flex:1;min-width:0}.row .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;color:var(--mut);border:1px solid #444;padding:1px 6px;border-radius:8px}
/* now playing */
#np{padding:20px;display:flex;flex-direction:column;background:linear-gradient(#3b2f66,var(--pn) 340px)}
#cvw{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#222;box-shadow:0 8px 30px #0008;flex:none}
#cvw img{width:100%;height:100%;object-fit:cover;display:block}
#ytw{position:absolute;inset:0;display:none;background:#000}
#ytw iframe{position:absolute;left:50%;top:50%;height:100%;width:178%;transform:translate(-50%,-50%);pointer-events:none;border:0}
#bt{font-size:24px;font-weight:800;margin-top:16px}#ba{color:var(--mut);margin:2px 0 6px}
#lines{margin-top:10px;padding-bottom:60px}
#lines p{margin:14px 0;font-size:22px;font-weight:800;color:#ffffff59;cursor:pointer;transition:color .2s}
#lines p:hover{color:#ffffffaa}#lines p.on{color:#fff}
/* bar */
#bar{grid-column:1/4;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 12px}
#mini{display:flex;align-items:center;gap:12px;min-width:0}#mini img{width:56px;height:56px;border-radius:4px;object-fit:cover;background:#222}
#mini b,#mini small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
#btns{display:flex;align-items:center;gap:10px}
#pp{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;font-size:15px;padding:0}#pp:hover{transform:scale(1.06);color:#000}
.sk{display:flex;align-items:center;gap:8px;width:100%;max-width:560px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#4d4d4d;outline:0;flex:1;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
#vol{max-width:110px}#right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto auto auto 84px;height:auto;min-height:100vh}#bar{grid-column:1;grid-template-columns:1fr auto;position:sticky;bottom:0;background:#000}#right,#bar .sk{display:none}#ctl{flex-direction:row}}
</style></head><body>
<div class="pn" id="side">
 <div class="nav on" id="navS" onclick="goSearch()"><i>🔍</i><span>Поиск</span></div>
 <div class="lib"><span>Моя библиотека</span><button onclick="newPl()" title="Новый плейлист">＋</button></div>
 <div id="pls"></div>
 <label class="up">Загрузить свои файлы<input type="file" id="f" accept="audio/*" multiple hidden></label>
</div>
<div class="pn" id="main">
 <input id="q" placeholder="Исполнитель или название трека">
 <h2 id="ttl">Результаты</h2><div id="res"></div>
</div>
<div class="pn" id="np">
 <div id="cvw"><img id="cover" alt=""><div id="ytw"><div id="yt"></div></div></div>
 <div id="bt">Выберите трек</div><div id="ba"></div>
 <div id="lines"></div>
</div>
<div class="pn" id="bar">
 <div id="mini"><img id="mc" alt=""><div style="min-width:0"><b id="mt"></b><small id="ma"></small></div><button onclick="addCur()" title="В плейлист">＋</button></div>
 <div id="ctl"><div id="btns"><button onclick="step(-1)">⏮</button><button id="pp" onclick="toggle()">▶</button><button onclick="step(1)">⏭</button></div>
  <div class="sk"><small id="tc">0:00</small><input type="range" id="seek" min="0" max="1000" value="0"><small id="td">0:00</small></div></div>
 <div id="right">🔊<input type="range" id="vol" min="0" max="1" step=".01" value=".8"></div>
</div>
<audio id="a"></audio>
<script>
const JAM='e7a3b64c',YTK='AIzaSyBbEaYskhWYXQpVi3DXGwXwaAc7PDg2lBY',APP='mymusic',AUD='https://api.audius.co';
const $=i=>document.getElementById(i),a=$('a');
let queue=[],cur=-1,lrc=[],act=-1,view='search',yt=null,ytReady=false,pend=null;
let pls=JSON.parse(localStorage.pls||'{"Избранное":[]}');
const save=()=>localStorage.pls=JSON.stringify(pls);
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const NAMES={jam:'Jamendo',aud:'Audius',yt:'YT',loc:'Файл'};

const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{playsinline:1,controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3},events:{onReady:()=>{ytReady=true;yt.setVolume(80);if(pend){yt.loadVideoById(pend);pend=null}},
 onStateChange:e=>{if(e.data==1)$('pp').textContent='⏸';if(e.data==2)$('pp').textContent='▶';if(e.data==0)step(1)}}})};

function renderPls(){$('navS').classList.toggle('on',view=='search');
 $('pls').innerHTML=Object.keys(pls).map(n=>`<div class="nav ${view==n?'on':''}" onclick="openPl('${esc(n)}')"><i>♪</i><span>${esc(n)}</span><button onclick="delPl(event,'${esc(n)}')">✕</button></div>`).join('')}
function newPl(){const n=prompt('Название плейлиста');if(n&&!pls[n]){pls[n]=[];save();renderPls()}}
function delPl(e,n){e.stopPropagation();if(confirm('Удалить «'+n+'»?')){delete pls[n];save();goSearch()}}
function openPl(n){view=n;$('ttl').textContent=n;show(pls[n]);renderPls()}
function goSearch(){view='search';renderPls();search($('q').value.trim()||'lofi')}
function addTo(i,e){e&&e.stopPropagation();const t=queue[i];if(!t)return;if(t.src=='loc')return alert('Свои файлы нельзя сохранить в плейлист');
 const names=Object.keys(pls),n=prompt('В какой плейлист добавить?\n'+names.join(', '),names[0]);
 if(n&&pls[n]&&!pls[n].some(x=>x.id==t.id)){pls[n].push(t);save()}}
const addCur=()=>addTo(cur);
function show(tracks){queue=tracks;$('res').innerHTML=tracks.length?tracks.map((t,i)=>`<div class="row ${i==cur?'cur':''}" onclick="play(${i})"><img src="${t.art||''}" alt=""><div><span class="t">${esc(t.title)}</span><small>${esc(t.artist)}</small></div><span class="tag">${NAMES[t.src]}</span><button onclick="addTo(${i},event)" title="В плейлист">＋</button></div>`).join(''):'<small>Ничего не найдено</small>'}

let tm;$('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value.trim()),600)};
async function search(q){if(!q)return;view='search';$('ttl').textContent='Результаты: '+q;renderPls();$('res').innerHTML='<small>Ищу…</small>';
 const j=u=>fetch(u).then(r=>r.json());
 const [y,jm,au]=await Promise.allSettled([
  j(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=20&q=${encodeURIComponent(q)}&key=${YTK}`),
  j(`https://api.jamendo.com/v3.0/tracks/?client_id=${JAM}&format=json&limit=5&search=${encodeURIComponent(q)}`),
  j(`${AUD}/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=${APP}`)]);
 let yo=[];
 if(y.value&&y.value.items)yo=y.value.items.map(v=>({src:'yt',id:v.id.videoId,title:dec(v.snippet.title),artist:dec(v.snippet.channelTitle).replace(/ - Topic$/,''),art:v.snippet.thumbnails.high.url,dur:0,topic:/ - Topic$/.test(v.snippet.channelTitle)}));
 yo.sort((x,z)=>z.topic-x.topic);
 const out=[...yo];
 if(jm.value&&jm.value.results)jm.value.results.forEach(t=>out.push({src:'jam',id:'j'+t.id,title:t.name,artist:t.artist_name,art:t.image,dur:t.duration,url:t.audio}));
 if(au.value&&au.value.data)au.value.data.slice(0,5).forEach(t=>out.push({src:'aud',id:'a'+t.id,title:t.title,artist:t.user.name,art:t.artwork&&(t.artwork['480x480']||t.artwork['150x150']),dur:t.duration,aid:t.id}));
 show(out);
 const err=y.status=='rejected'?'нет соединения с YouTube':(y.value&&y.value.error?y.value.error.message:'');
 if(err)$('res').insertAdjacentHTML('afterbegin','<div style="padding:8px;margin-bottom:8px;border-radius:8px;background:#ff4d4d22;color:#ff9a9a;font-size:12px">YouTube: '+esc(err)+'</div>')}

function stopAll(){a.pause();if(ytReady)try{yt.pauseVideo()}catch(e){}}
function play(i){cur=i;const t=queue[i];stopAll();$('ytw').style.display=t.src=='yt'?'block':'none';
 if(t.src=='yt'){if(ytReady)yt.loadVideoById(t.id);else pend=t.id}
 else{a.src=t.src=='aud'?`${AUD}/v1/tracks/${t.aid}/stream?app_name=${APP}`:t.url;a.play()}
 $('cover').src=$('mc').src=t.art||'';$('bt').textContent=$('mt').textContent=t.title;$('ba').textContent=$('ma').textContent=t.artist;document.title=t.title+' — '+t.artist;
 $('res').querySelectorAll('.row').forEach((r,k)=>r.classList.toggle('cur',k==i));loadLyrics(t)}
const isYt=()=>cur>=0&&queue[cur]&&queue[cur].src=='yt';
function toggle(){if(cur<0)return;if(isYt()){ytReady&&(yt.getPlayerState()==1?yt.pauseVideo():yt.playVideo())}else a.paused?a.play():a.pause()}
function step(d){if(queue.length)play((cur+d+queue.length)%queue.length)}
function seekTo(x){isYt()?yt.seekTo(x,true):a.currentTime=x}
a.onplay=()=>$('pp').textContent='⏸';a.onpause=()=>$('pp').textContent='▶';a.onended=()=>step(1);
$('vol').oninput=e=>{a.volume=e.target.value;if(ytReady)yt.setVolume(e.target.value*100)};a.volume=.8;
$('seek').oninput=e=>{const d=isYt()?yt.getDuration():a.duration;seekTo(e.target.value/1000*(d||0))};

function guess(t){if(t.src!='yt')return[t.artist,t.title];
 let n=t.title.replace(/[\(\[].*?[\)\]]/g,'').replace(/official|video|lyrics|audio|hd|4k|ft\..*|feat\..*/ig,'').trim();
 const p=n.split(/\s[-–—]\s/);if(p.length>=2)return[p[0].trim(),p.slice(1).join(' ').trim()];
 return[t.artist.replace(/VEVO/ig,'').trim(),n]}
async function loadLyrics(t){lrc=[];act=-1;$('lines').innerHTML='<small>Ищу текст…</small>';
 try{const[ar,ti]=guess(t);let j=null;const p=new URLSearchParams({artist_name:ar,track_name:ti});if(t.dur)p.set('duration',Math.round(t.dur));
 const r=await fetch('https://lrclib.net/api/get?'+p);if(r.ok)j=await r.json();
 if(!j||!j.syncedLyrics){const s=await(await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(ar+' '+ti))).json();j=s.find(x=>x.syncedLyrics)||s[0]}
 if(j&&j.syncedLyrics){lrc=j.syncedLyrics.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+\.?\d*)\](.*)/);return m&&{t:+m[1]*60+ +m[2],s:m[3].trim()}}).filter(Boolean);
  $('lines').innerHTML=lrc.map((l,i)=>`<p id="l${i}" onclick="seekTo(${l.t})">${esc(l.s)||'♪'}</p>`).join('')}
 else $('lines').innerHTML=j&&j.plainLyrics?`<small style="white-space:pre-wrap">${esc(j.plainLyrics)}</small>`:'<small>Текст не найден</small>'}
 catch(e){$('lines').innerHTML='<small>Не удалось загрузить текст</small>'}}

setInterval(()=>{if(cur<0)return;let c,d;
 if(isYt()){if(!ytReady||!yt.getCurrentTime)return;c=yt.getCurrentTime();d=yt.getDuration()}else{c=a.currentTime;d=a.duration}
 $('tc').textContent=fmt(c);$('td').textContent=fmt(d);if(d)$('seek').value=c/d*1000;
 let i=-1;for(let k=0;k<lrc.length;k++){if(lrc[k].t<=c+.15)i=k;else break}
 if(i!=act){const o=$('l'+act);o&&o.classList.remove('on');act=i;const n=$('l'+i);if(n){n.classList.add('on');n.scrollIntoView({block:'center',behavior:'smooth'})}}},250);

$('f').onchange=e=>{const t=[...e.target.files].map((f,i)=>({src:'loc',id:'L'+i,title:f.name.replace(/\.[^.]+$/,''),artist:'Мой файл',dur:0,url:URL.createObjectURL(f)}));
 view='search';$('ttl').textContent='Мои файлы';show(t);play(0)};
renderPls();search('lofi');
</script></body></html>
