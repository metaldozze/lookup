<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя рабочая зона */
    .main-wrapper {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
      min-height: 0;
      overflow: hidden;
    }

    /* Сайдбар */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: #09090b;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid #18181b;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      list-style: none;
    }

    .nav-item {
      color: #a1a1aa;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: #18181b;
    }

    .user-pill {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #18181b;
      cursor: pointer;
      border: 1px solid #27272a;
    }

    .user-pill img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Контент */
    .content-area {
      flex: 1;
      min-width: 0;
      background: linear-gradient(180deg, #18181b 0%, #09090b 50%);
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      gap: 32px;
    }

    .views {
      flex: 1;
      min-width: 0;
    }

    .view-tab {
      display: none;
    }

    .view-tab.active {
      display: block;
    }

    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }

    .track-row:hover {
      background: #18181b;
    }

    .track-row.playing {
      background: #18181b;
      border-color: #27272a;
    }

    .track-row.playing .track-name {
      color: #22c55e;
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .track-cover-mini {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-title-box {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .track-artist {
      font-size: 12px;
      color: #71717a;
    }

    /* Панель текста */
    .lyrics-panel {
      width: 340px;
      min-width: 340px;
      background: #101012;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: fit-content;
      max-height: 100%;
    }

    .lyrics-panel.hidden {
      display: none;
    }

    .lyrics-title {
      font-size: 13px;
      font-weight: 700;
      color: #71717a;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lyrics-text {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.8;
      color: #e4e4e7;
      overflow-y: auto;
    }

    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid #27272a;
      background: #18181b;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 24px;
    }

    /* Нижний бар */
    .bottom-player {
      height: 90px;
      min-height: 90px;
      background: #09090b;
      border-top: 1px solid #18181b;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 20;
    }

    .now-playing {
      width: 25%;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .current-cover {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      background: #18181b;
      flex-shrink: 0;
    }

    .player-controls {
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }

    .ctrl-btn:hover {
      color: #fff;
    }

    .ctrl-btn.active {
      color: #22c55e;
    }

    .play-circle {
      width: 36px;
      height: 36px;
      background: #ffffff;
      color: #000;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      font-size: 11px;
      color: #71717a;
    }

    .timeline-slider {
      flex: 1;
      accent-color: #22c55e;
      cursor: pointer;
    }

    .extra-controls {
      width: 25%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
    }

    .lyrics-toggle-btn {
      background: #18181b;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.15s;
    }

    .lyrics-toggle-btn.active {
      color: #fff;
      border-color: #22c55e;
    }
  </style>
</head>
<body>

  <!-- Стандартный стабильный аудиоплеер браузера -->
  <audio id="coreAudio" preload="auto"></audio>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="logo">✦ STREAM WEB</div>
      <ul class="nav-list">
        <li class="nav-item active" onclick="switchTab('home')">Главная</li>
        <li class="nav-item" onclick="switchTab('search')">Поиск</li>
        <li class="nav-item" onclick="switchTab('profile')">Мой профиль</li>
      </ul>

      <div class="user-pill" onclick="switchTab('profile')">
        <img id="sideAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="avatar">
        <div>
          <div id="sideName" style="font-size: 13px; font-weight: 700;">User</div>
          <div style="font-size: 11px; color: #71717a;">Free Member</div>
        </div>
      </div>
    </aside>

    <main class="content-area">
      <div class="views">
        <!-- Главная -->
        <div id="tab-home" class="view-tab active">
          <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 4px;">Рекомендации</h2>
          <p style="color: #71717a; font-size: 13px; margin-bottom: 24px;">Кликни на трек, чтобы включить воспроизведение</p>
          <div id="tracksList"></div>
        </div>

        <!-- Поиск -->
        <div id="tab-search" class="view-tab">
          <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 16px;">Поиск треков</h2>
          <input type="text" id="searchInput" class="search-input" placeholder="Название трека или артист..." oninput="handleSearch()">
          <div id="searchResults"></div>
        </div>

        <!-- Профиль -->
        <div id="tab-profile" class="view-tab">
          <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 20px;">Настройки профиля</h2>
          <div style="background:#18181b; padding:24px; border-radius:12px; max-width:400px; display:flex; flex-direction:column; gap:14px; border:1px solid #27272a;">
            <div>
              <label style="font-size:12px; color:#71717a; display:block; margin-bottom:6px;">URL Аватарки</label>
              <input type="text" id="inputAvatar" style="width:100%; background:#09090b; border:1px solid #27272a; padding:10px; color:#fff; border-radius:6px; font-size:13px;" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80">
            </div>
            <div>
              <label style="font-size:12px; color:#71717a; display:block; margin-bottom:6px;">Имя</label>
              <input type="text" id="inputName" style="width:100%; background:#09090b; border:1px solid #27272a; padding:10px; color:#fff; border-radius:6px; font-size:13px;" value="User_01">
            </div>
            <button onclick="saveProfile()" style="background:#fff; color:#000; border:none; padding:10px; font-weight:700; border-radius:6px; cursor:pointer;">Сохранить изменения</button>
          </div>
        </div>
      </div>

      <!-- Текст песни -->
      <div id="lyricsPanel" class="lyrics-panel">
        <div class="lyrics-title">
          <span>Текст песни</span>
          <span style="cursor:pointer;" onclick="toggleLyricsPanel()">✕</span>
        </div>
        <div id="lyricsContent" class="lyrics-text">Выберите трек, чтобы увидеть слова</div>
      </div>
    </main>
  </div>

  <footer class="bottom-player">
    <div class="now-playing">
      <img id="currentCover" class="current-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80" alt="Cover">
      <div>
        <div id="currentTitle" style="font-size: 13px; font-weight: 600;">Выберите трек</div>
        <div id="currentArtist" style="font-size: 11px; color: #71717a;">—</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="btns">
        <button id="shuffleBtn" class="ctrl-btn" onclick="toggleShuffle()" title="Перемешать">🔀</button>
        <button class="ctrl-btn" onclick="prevTrack()" title="Предыдущий">⏮</button>
        <button id="playBtn" class="ctrl-btn play-circle" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Следующий">⏭</button>
        <button id="repeatBtn" class="ctrl-btn" onclick="toggleRepeat()" title="Повтор">🔁</button>
      </div>

      <div class="timeline-bar">
        <span id="timeCurrent">0:00</span>
        <input type="range" id="progressBar" class="timeline-slider" min="0" max="100" value="0" oninput="seekTrack(event)">
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="extra-controls">
      <button id="lyricsBtn" class="lyrics-toggle-btn active" onclick="toggleLyricsPanel()">Текст</button>
      <span id="statusText" style="font-size: 11px; color: #71717a;">Пауза</span>
    </div>
  </footer>

  <script>
    const SONGS = [
      {
        id: 0,
        title: "holodno333",
        artist: "ONDA ANDAR",
        duration: "2:14",
        audioUrl: "https://actions.google.com/sounds/v1/ambiences/winter_wind.ogg",
        cover: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&q=80",
        lyrics: "На часах опять зима\nСлишком холодно дышать, кругом дома\nСвет неоновых витрин слепит глаза\nЯ не знаю, что еще сказать..."
      },
      {
        id: 1,
        title: "KIDSCRY2DAY",
        artist: "ONDA ANDAR",
        duration: "2:04",
        audioUrl: "https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg",
        cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80",
        lyrics: "Kids cry today, kids cry every day\nМы остаемся здесь в тени ночей\nСлезы на щеках, назад пути нет\nХолодный свет фонарей режет силуэт..."
      },
      {
        id: 2,
        title: "herons",
        artist: "ONDA ANDAR",
        duration: "2:18",
        audioUrl: "https://actions.google.com/sounds/v1/water/lake_waves_lap.ogg",
        cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80",
        lyrics: "Белые птицы над серой водой\nЯ ухожу за тобой\nХолодный ветер сбивает следы\nГде-то на самом краю темноты..."
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const audio = document.getElementById('coreAudio');

    function renderList(list, targetElementId) {
      const container = document.getElementById(targetElementId);
      container.innerHTML = '';
      list.forEach((song) => {
        const isCurrent = song.id === SONGS[currentIndex].id;
        const row = document.createElement('div');
        row.className = `track-row ${isCurrent ? 'playing' : ''}`;
        row.onclick = () => loadAndPlay(song.id);
        row.innerHTML = `
          <div class="track-left">
            <img class="track-cover-mini" src="${song.cover}" alt="cover">
            <div class="track-title-box">
              <span class="track-name">${song.title}</span>
              <span class="track-artist">${song.artist}</span>
            </div>
          </div>
          <span style="font-size: 12px; color: #71717a;">${song.duration}</span>
        `;
        container.appendChild(row);
      });
    }

    function loadAndPlay(id) {
      currentIndex = SONGS.findIndex(s => s.id === id);
      const song = SONGS[currentIndex];

      audio.src = song.audioUrl;
      document.getElementById('currentCover').src = song.cover;
      document.getElementById('currentTitle').innerText = song.title;
      document.getElementById('currentArtist').innerText = song.artist;
      document.getElementById('lyricsContent').innerText = song.lyrics;

      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('playBtn').innerText = '⏸';
        document.getElementById('statusText').innerText = 'Играет';
      }).catch(err => console.log('Кликните по странице для воспроизведения', err));

      renderList(SONGS, 'tracksList');
    }

    function togglePlay() {
      if (!audio.src) {
        loadAndPlay(SONGS[0].id);
        return;
      }
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('playBtn').innerText = '▶';
        document.getElementById('statusText').innerText = 'Пауза';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          document.getElementById('playBtn').innerText = '⏸';
          document.getElementById('statusText').innerText = 'Играет';
        });
      }
    }

    function nextTrack() {
      if (isShuffle) {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * SONGS.length);
        } while (randomIndex === currentIndex && SONGS.length > 1);
        loadAndPlay(SONGS[randomIndex].id);
      } else {
        const nextId = (currentIndex + 1) % SONGS.length;
        loadAndPlay(SONGS[nextId].id);
      }
    }

    function prevTrack() {
      const prevId = (currentIndex - 1 + SONGS.length) % SONGS.length;
      loadAndPlay(SONGS[prevId].id);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
    }

    function toggleLyricsPanel() {
      const panel = document.getElementById('lyricsPanel');
      const btn = document.getElementById('lyricsBtn');
      panel.classList.toggle('hidden');
      btn.classList.toggle('active');
    }

    function seekTrack(e) {
      if (audio.duration) {
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    }

    audio.ontimeupdate = () => {
      const curr = audio.currentTime;
      const dur = audio.duration || 0;
      document.getElementById('timeCurrent').innerText = formatSeconds(curr);
      if (dur > 0) {
        document.getElementById('timeDuration').innerText = formatSeconds(dur);
        document.getElementById('progressBar').value = (curr / dur) * 100;
      }
    };

    audio.onended = () => {
      if (isRepeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        nextTrack();
      }
    };

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = SONGS.filter(s => 
        s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
      );
      renderList(filtered, 'searchResults');
    }

    function switchTab(tab) {
      document.querySelectorAll('.view-tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      const tabs = ['home', 'search', 'profile'];
      const index = tabs.indexOf(tab);
      if (index !== -1) {
        document.querySelectorAll('.nav-item')[index].classList.add('active');
      }

      if (tab === 'search') handleSearch();
    }

    function saveProfile() {
      const name = document.getElementById('inputName').value;
      const avatar = document.getElementById('inputAvatar').value;
      document.getElementById('sideName').innerText = name;
      document.getElementById('sideAvatar').src = avatar;
      alert('Профиль сохранен!');
    }

    // Запуск
    renderList(SONGS, 'tracksList');
  </script>
</body>
</html>
