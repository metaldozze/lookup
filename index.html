<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Моя музыка</title>
<style>
:root{--bg:#0d0d12;--card:#17171f;--tx:#f2f2f5;--mut:#8b8b99;--ac:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr auto}
aside{background:var(--card);padding:14px;display:flex;flex-direction:column;min-height:0}
#res{flex:1;overflow:auto;min-height:0}
main{display:flex;flex-direction:column;align-items:center;padding:24px 20px 0;min-height:0;background:linear-gradient(#25204a,var(--bg) 60%)}
h3{margin:10px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase}
input[type=text]{width:100%;padding:10px 14px;border-radius:20px;border:0;background:#ffffff14;color:var(--tx);font-size:15px;margin-bottom:8px}
button{background:none;border:0;color:var(--tx);cursor:pointer;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{padding:5px 12px;border-radius:16px;background:#ffffff14;font-size:13px;cursor:pointer}.chip.on{background:var(--ac)}
.row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer}
.row:hover{background:#ffffff0f}.row.cur{background:#7c5cff30}
.row img{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#333}
.row div{flex:1;min-width:0}.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{color:var(--mut)}.tag{font-size:10px;padding:2px 6px;border-radius:8px;background:#ffffff18;color:var(--mut)}
#ytw{display:none;width:200px;height:200px;margin:8px auto 0;flex:none}#ytw iframe{width:100%;height:100%;border-radius:8px}
#cover{width:min(36vh,320px);aspect-ratio:1;object-fit:cover;border-radius:12px;box-shadow:0 20px 50px #000a;background:linear-gradient(135deg,#3a2f7a,#1b1b2a);flex:none}
#bt{font-size:26px;font-weight:800;margin-top:18px;text-align:center}#ba{color:var(--mut);margin:4px 0 12px;text-align:center}
#lines{flex:1;overflow:auto;width:100%;max-width:640px;text-align:center;padding:10px 0 40px;min-height:0;scrollbar-width:none}
#lines p{margin:12px 0;font-size:20px;color:#ffffff55;cursor:pointer;transition:.25s}
#lines p.on{color:var(--tx);font-weight:800;font-size:25px}
footer{grid-column:1/3;background:var(--card);padding:12px 20px;display:flex;align-items:center;gap:16px;border-top:1px solid #ffffff14}
#seek{flex:1;accent-color:var(--ac)}input[type=range]{margin:0}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:auto;min-height:100vh}aside{order:2;max-height:50vh}main{order:1}footer{grid-column:1;order:3;position:sticky;bottom:0}#lines{min-height:200px}}
</style></head><body>
<aside>
<input type="text" id="q" placeholder="Поиск исполнителя или трека…">
<div class="chips" id="pls"></div>
<small id="ttl">Поиск</small>
<div id="res"></div>
<div id="ytw"><div id="yt"></div></div>
<input type="file" id="f" accept="audio/*" multiple style="font-size:12px;color:var(--mut);margin-top:8px">
</aside>
<main>
<img id="cover" alt="">
<div id="bt">Выберите трек</div><div id="ba"></div>
<div id="lines"></div>
</main>
<footer>
<button onclick="step(-1)">⏮</button><button id="pp" onclick="toggle()" style="font-size:26px">▶</button><button onclick="step(1)">⏭</button>
<small id="tc">0:00</small><input type="range" id="seek" min="0" max="1000" value="0"><small id="td">0:00</small>
<button onclick="addCur()" title="В плейлист">＋</button>
<input type="range" id="vol" min="0" max="1" step=".01" value=".8" style="width:80px">
</footer>
<audio id="a"></audio>
<script>
const JAM='e7a3b64c',YTK='AIzaSyBbEaYskhWYXQpVi3DXGwXwaAc7PDg2lBY',APP='mymusic',AUD='https://api.audius.co';
const $=i=>document.getElementById(i),a=$('a');
let queue=[],cur=-1,lrc=[],act=-1,view='search',yt=null,ytReady=false,pend=null;
let pls=JSON.parse(localStorage.pls||'{"Избранное":[]}');
const save=()=>localStorage.pls=JSON.stringify(pls);
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const NAMES={jam:'Jamendo',aud:'Audius',yt:'YouTube',loc:'Файл'};

const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{width:200,height:200,playerVars:{playsinline:1},events:{onReady:()=>{ytReady=true;yt.setVolume(80);if(pend){yt.loadVideoById(pend);pend=null}},
 onStateChange:e=>{if(e.data==1)$('pp').textContent='⏸';if(e.data==2)$('pp').textContent='▶';if(e.data==0)step(1)}}})};

function renderPls(){$('pls').innerHTML=`<span class="chip ${view=='search'?'on':''}" onclick="view='search';search($('q').value.trim()||'lofi')">Поиск</span>`+Object.keys(pls).map(n=>`<span class="chip ${view==n?'on':''}" onclick="openPl('${esc(n)}')">♪ ${esc(n)} <b onclick="delPl(event,'${esc(n)}')" style="opacity:.6">✕</b></span>`).join('')+`<span class="chip" onclick="newPl()" style="color:var(--ac)">＋ плейлист</span>`}
function newPl(){const n=prompt('Название плейлиста');if(n&&!pls[n]){pls[n]=[];save();renderPls()}}
function delPl(e,n){e.stopPropagation();if(confirm('Удалить «'+n+'»?')){delete pls[n];save();view='search';renderPls()}}
function openPl(n){view=n;$('ttl').textContent='Плейлист: '+n;show(pls[n]);renderPls()}
function addTo(i,e){e&&e.stopPropagation();const t=queue[i];if(!t)return;if(t.src=='loc')return alert('Свои файлы нельзя сохранить в плейлист');
 const names=Object.keys(pls),n=prompt('В какой плейлист добавить?\n'+names.join(', '),names[0]);
 if(n&&pls[n]&&!pls[n].some(x=>x.id==t.id)){pls[n].push(t);save()}}
const addCur=()=>addTo(cur);
function show(tracks){queue=tracks;$('res').innerHTML=tracks.length?tracks.map((t,i)=>`<div class="row ${i==cur?'cur':''}" onclick="play(${i})"><img src="${t.art||''}" alt=""><div><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div><span class="tag">${NAMES[t.src]}</span><button onclick="addTo(${i},event)">＋</button></div>`).join(''):'<small>Ничего не найдено</small>'}

let tm;$('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value.trim()),600)};
async function search(q){if(!q)return;view='search';$('ttl').textContent='Результаты: '+q;renderPls();$('res').innerHTML='<small>Ищу…</small>';
 const j=u=>fetch(u).then(r=>r.json());
 const [y,jm,au]=await Promise.allSettled([
  j(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=12&q=${encodeURIComponent(q)}&key=${YTK}`),
  j(`https://api.jamendo.com/v3.0/tracks/?client_id=${JAM}&format=json&limit=6&search=${encodeURIComponent(q)}`),
  j(`${AUD}/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=${APP}`)]);
 const out=[];
 if(y.value&&y.value.items)y.value.items.forEach(v=>out.push({src:'yt',id:v.id.videoId,title:dec(v.snippet.title),artist:dec(v.snippet.channelTitle).replace(/ - Topic$/,''),art:v.snippet.thumbnails.high.url,dur:0}));
 if(jm.value&&jm.value.results)jm.value.results.forEach(t=>out.push({src:'jam',id:'j'+t.id,title:t.name,artist:t.artist_name,art:t.image,dur:t.duration,url:t.audio}));
 if(au.value&&au.value.data)au.value.data.slice(0,6).forEach(t=>out.push({src:'aud',id:'a'+t.id,title:t.title,artist:t.user.name,art:t.artwork&&(t.artwork['480x480']||t.artwork['150x150']),dur:t.duration,aid:t.id}));
 show(out);
 const err=y.status=='rejected'?'нет соединения с YouTube':(y.value&&y.value.error?y.value.error.message:'');
 if(err)$('res').insertAdjacentHTML('afterbegin','<div style="padding:8px;margin-bottom:8px;border-radius:8px;background:#ff4d4d22;color:#ff9a9a;font-size:12px">YouTube: '+esc(err)+'</div>')}

function stopAll(){a.pause();if(ytReady)try{yt.pauseVideo()}catch(e){}}
function play(i){cur=i;const t=queue[i];stopAll();$('ytw').style.display=t.src=='yt'?'block':'none';
 if(t.src=='yt'){if(ytReady)yt.loadVideoById(t.id);else pend=t.id}
 else{a.src=t.src=='aud'?`${AUD}/v1/tracks/${t.aid}/stream?app_name=${APP}`:t.url;a.play()}
 $('cover').src=t.art||'';$('bt').textContent=t.title;$('ba').textContent=t.artist;document.title=t.title+' — '+t.artist;
 $('res').querySelectorAll('.row').forEach((r,k)=>r.classList.toggle('cur',k==i));loadLyrics(t)}
const isYt=()=>cur>=0&&queue[cur]&&queue[cur].src=='yt';
function toggle(){if(cur<0)return;if(isYt()){ytReady&&(yt.getPlayerState()==1?yt.pauseVideo():yt.playVideo())}else a.paused?a.play():a.pause()}
function step(d){if(queue.length)play((cur+d+queue.length)%queue.length)}
function seekTo(x){isYt()?yt.seekTo(x,true):a.currentTime=x}
a.onplay=()=>$('pp').textContent='⏸';a.onpause=()=>$('pp').textContent='▶';a.onended=()=>step(1);
$('vol').oninput=e=>{a.volume=e.target.value;if(ytReady)yt.setVolume(e.target.value*100)};a.volume=.8;
$('seek').oninput=e=>{const d=isYt()?yt.getDuration():a.duration;seekTo(e.target.value/1000*(d||0))};

function guess(t){if(t.src!='yt')return[t.artist,t.title];
 let n=t.title.replace(/[\(\[].*?[\)\]]/g,'').replace(/official|video|lyrics|audio|hd|4k|ft\..*|feat\..*/ig,'').trim();
 const p=n.split(/\s[-–—]\s/);if(p.length>=2)return[p[0].trim(),p.slice(1).join(' ').trim()];
 return[t.artist.replace(/VEVO/ig,'').trim(),n]}
async function loadLyrics(t){lrc=[];act=-1;$('lines').innerHTML='<small>Ищу текст…</small>';
 try{const[ar,ti]=guess(t);let j=null;const p=new URLSearchParams({artist_name:ar,track_name:ti});if(t.dur)p.set('duration',Math.round(t.dur));
 const r=await fetch('https://lrclib.net/api/get?'+p);if(r.ok)j=await r.json();
 if(!j||!j.syncedLyrics){const s=await(await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(ar+' '+ti))).json();j=s.find(x=>x.syncedLyrics)||s[0]}
 if(j&&j.syncedLyrics){lrc=j.syncedLyrics.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+\.?\d*)\](.*)/);return m&&{t:+m[1]*60+ +m[2],s:m[3].trim()}}).filter(Boolean);
  $('lines').innerHTML=lrc.map((l,i)=>`<p id="l${i}" onclick="seekTo(${l.t})">${esc(l.s)||'♪'}</p>`).join('')}
 else $('lines').innerHTML=j&&j.plainLyrics?`<small style="white-space:pre-wrap">${esc(j.plainLyrics)}</small>`:'<small>Текст не найден</small>'}
 catch(e){$('lines').innerHTML='<small>Не удалось загрузить текст</small>'}}

setInterval(()=>{if(cur<0)return;let c,d;
 if(isYt()){if(!ytReady||!yt.getCurrentTime)return;c=yt.getCurrentTime();d=yt.getDuration()}else{c=a.currentTime;d=a.duration}
 $('tc').textContent=fmt(c);$('td').textContent=fmt(d);if(d)$('seek').value=c/d*1000;
 let i=-1;for(let k=0;k<lrc.length;k++){if(lrc[k].t<=c+.15)i=k;else break}
 if(i!=act){const o=$('l'+act);o&&o.classList.remove('on');act=i;const n=$('l'+i);if(n){n.classList.add('on');n.scrollIntoView({block:'center',behavior:'smooth'})}}},250);

$('f').onchange=e=>{const t=[...e.target.files].map((f,i)=>({src:'loc',id:'L'+i,title:f.name.replace(/\.[^.]+$/,''),artist:'Мой файл',dur:0,url:URL.createObjectURL(f)}));
 view='search';$('ttl').textContent='Мои файлы';show(t);play(0)};
renderPls();search('lofi');
</script></body></html>
